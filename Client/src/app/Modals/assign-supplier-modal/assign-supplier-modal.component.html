<form #editForm="ngForm">
  <p-dialog header="Edit Medicine" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }" *ngIf="medicine">
    <span class="p-text-secondary block mb-8">Assign Supplier To Medicine</span>
    <div class="flex items-center gap-4 mb-8">
        <label for="supplierId" class="font-semibold w-24">Supplier ID</label>
        <input
          [(ngModel)]="medicine.supplierId"
          pInputText id="supplierId"
          class="flex-auto"
          autocomplete="off"
          name="supplierId"
          required
          #supplierId="ngModel"
        />
    </div>
    <div *ngIf="supplierId.dirty && supplierId.invalid">
      <small class="error-info" *ngIf="supplierId.errors?.['required']">* Supplier Id is required</small>
    </div>

    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="closeDialog()" />
        <p-button label="Save" [disabled]="editForm.invalid || !editForm.dirty" (click)="updateMedicine()" />
    </div>
  </p-dialog>
</form>
