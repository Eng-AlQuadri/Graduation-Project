<form #editForm="ngForm">
  <p-dialog header="Create Medicine" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-8">Create Medicine information.</span>
    <div class="flex items-center gap-4 mb-4">
        <label for="name" class="font-semibold w-24">Name</label>
        <input
          [(ngModel)]="medicine.name"
          pInputText id="name"
          class="flex-auto"
          autocomplete="off"
          name="name"
          #name="ngModel"
          required
          minlength="3"
          maxlength="15"
        />
    </div>
    <div *ngIf="name.dirty && name.invalid">
      <small class="error-info" *ngIf="name.errors?.['required']">* Name is required</small>
      <small class="error-info" *ngIf="name.errors?.['minlength']">* Min length is 3 characters</small>
      <small class="error-info" *ngIf="name.errors?.['maxlength']">* Max length is 15 characters</small>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="packing" class="font-semibold w-24">Packing</label>
        <input
          [(ngModel)]="medicine.packing"
          pInputText id="packing"
          class="flex-auto"
          autocomplete="off"
          name="packing"
          required
          #packing="ngModel"
        />
    </div>
    <div *ngIf="packing.dirty && packing.invalid">
      <small class="error-info" *ngIf="packing.errors?.['required']">* Packing is required</small>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="price" class="font-semibold w-24">Price</label>
        <input
          [(ngModel)]="medicine.price"
          pInputText id="price"
          class="flex-auto"
          autocomplete="off"
          name="price"
          required
          #price="ngModel"
        />
    </div>
    <div *ngIf="price.dirty && price.invalid">
      <small class="error-info" *ngIf="price.errors?.['required']">* Price is required</small>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="price" class="font-semibold w-24">Stock</label>
        <input
          [(ngModel)]="medicine.stock"
          pInputText id="stock"
          class="flex-auto"
          autocomplete="off"
          name="stock"
          required
          #stock="ngModel"
        />
    </div>
    <div *ngIf="stock.dirty && stock.invalid">
      <small class="error-info" *ngIf="stock.errors?.['required']">* Stock is required</small>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="price" class="font-semibold w-24">Expiry Date</label>
        <input
          [(ngModel)]="medicine.expiryDate"
          pInputText id="stock"
          class="flex-auto"
          autocomplete="off"
          name="expiryDate"
          required
          type="date"
          #expDate="ngModel"
        />
    </div>
    <div *ngIf="expDate.dirty && expDate.invalid">
      <small class="error-info" *ngIf="expDate.errors?.['required']">* Expiry Date is required</small>
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="closeDialog()" />
        <p-button label="Save" [disabled]="editForm.invalid || !editForm.dirty" (click)="createMedicine()" />
    </div>
  </p-dialog>
</form>
