<form #editForm="ngForm">
  <p-dialog header="Edit Patient" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }" *ngIf="deliveryWorker">
    <span class="p-text-secondary block mb-8">Update Delivery Worker Information.</span>
    <div class="flex items-center gap-4 mb-4">
        <label for="username" class="font-semibold w-24">Username</label>
        <input
          [(ngModel)]="deliveryWorker.userName"
          pInputText id="username"
          class="flex-auto"
          autocomplete="off"
          name="userName"
          #username="ngModel"
          required
          minlength="3"
          maxlength="15"
        />
    </div>
    <div *ngIf="username.dirty && username.invalid">
      <small class="error-info" *ngIf="username.errors?.['required']">* Username is required</small>
      <small class="error-info" *ngIf="username.errors?.['minlength']">* Min length is 3 characters</small>
      <small class="error-info" *ngIf="username.errors?.['maxlength']">* Max length is 15 characters</small>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="email" class="font-semibold w-24">Email</label>
        <input
          [(ngModel)]="deliveryWorker.email"
          pInputText id="email"
          type="email"
          class="flex-auto"
          autocomplete="off"
          name="email"
          required
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
          #email="ngModel"
        />
    </div>
    <div *ngIf="email.dirty && email.invalid">
      <small class="error-info" *ngIf="email.errors?.['required']">* Email is required</small>
      <small class="error-info" *ngIf="email.errors?.['pattern']">* Invailed email</small>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="email" class="font-semibold w-24">Phone Number</label>
        <input
          [(ngModel)]="deliveryWorker.phoneNumber"
          pInputText id="phoneNumber"
          class="flex-auto"
          autocomplete="off"
          name="phoneNumber"
          required
          pattern="^\d{10}$"
          #phoneNumber="ngModel"
        />
    </div>
    <div *ngIf="phoneNumber.dirty && phoneNumber.invalid">
      <small class="error-info" *ngIf="phoneNumber.errors?.['required']">* Phone number is required</small>
      <small class="error-info" *ngIf="phoneNumber.errors?.['pattern']">* Invalid phone number</small>
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="closeDialog()" />
        <p-button label="Save" [disabled]="editForm.invalid || !editForm.dirty" (click)="updateDoctor()" />
    </div>
  </p-dialog>
</form>
