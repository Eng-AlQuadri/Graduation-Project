<form #editForm="ngForm">
  <p-dialog header="Registration" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-8">Register Data</span>
    <div class="flex items-center gap-4 mb-4">
        <label for="username" class="font-semibold w-24">Username</label>
        <input
          [(ngModel)]="patient.userName"
          pInputText id="username"
          class="flex-auto"
          autocomplete="off"
          name="userName"
          required
          minlength="3"
          maxlength="15"
          #userName="ngModel"
        />
    </div>
    <div *ngIf="userName.dirty && userName.invalid">
      <small class="error-info" *ngIf="userName.errors?.['required']">* Username is required</small>
      <small class="error-info" *ngIf="userName.errors?.['minlength']">* Min length is 3 characters</small>
      <small class="error-info" *ngIf="userName.errors?.['maxlength']">* Max length is 15 characters</small>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="email" class="font-semibold w-24">Email</label>
        <input
          [(ngModel)]="patient.email"
          pInputText id="email"
          class="flex-auto"
          autocomplete="off"
          name="email"
          type="email"
          required
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
          #email="ngModel"
        />
    </div>
    <div *ngIf="email.dirty && email.invalid">
      <small class="error-info" *ngIf="email.errors?.['required']">* Email is required</small>
      <small class="error-info" *ngIf="email.errors?.['pattern']">* Invalid email</small>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="email" class="font-semibold w-24">Phone Number</label>
        <input
          [(ngModel)]="patient.phoneNumber"
          pInputText id="phoneNumber"
          class="flex-auto"
          autocomplete="off"
          name="phoneNumber"
          required
          pattern="^\d{10}$"
          #phoneNumber="ngModel"
        />
    </div>
    <div *ngIf="phoneNumber.dirty && phoneNumber.invalid">
      <small class="error-info" *ngIf="phoneNumber.errors?.['required']">* Phone number required</small>
      <small class="error-info" *ngIf="phoneNumber.errors?.['pattern']">* Invalid phone number</small>
    </div>
        <div class="flex items-center gap-4 mb-8">
        <label for="password" class="font-semibold w-24">Password</label>
        <input
          [(ngModel)]="patient.password"
          pInputText id="password"
          class="flex-auto"
          autocomplete="off"
          name="password"
          type="password"
          required
          #password="ngModel"
        />
    </div>
    <div *ngIf="password.dirty && password.invalid">
      <small class="error-info" *ngIf="email.errors?.['required']">* Password is required</small>
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="closeDialog()" />
        <p-button label="Save" [disabled]="editForm.invalid || !editForm.dirty" (click)="createPatient()" />
    </div>
  </p-dialog>
</form>
