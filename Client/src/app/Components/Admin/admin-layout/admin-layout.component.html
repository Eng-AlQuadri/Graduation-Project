<div class="defaultLayout">
  <div class="upperBar">
      <div class="holder">
          <span class="icon" id="icon" (click)="handleIconClick()">
              <i class="pi pi-bars"></i>
          </span>
          <span class="settingsHolder">
              <h4>Adminstrator</h4>
          </span>
      </div>
  </div>
  <div class= "{{isAsideOpen ? 'aside closed' : 'aside'}}" id='aside'>
      <ul>
          <li id="header">
            <span class="icon"><i class="fa-solid fa-stethoscope"></i></span>
            <span class="title">Pharmacy System</span>
          </li>
          <li routerLinkActive="selected">
            <a routerLink="patients" class="nav-link"><i class="fa-solid fa-bed-pulse"></i>Patients</a>
          </li>
          <li routerLinkActive="selected">
            <a routerLink="doctors" class="nav-link"><i class="fa-solid fa-user-doctor"></i>Doctors</a>
          </li>
          <li routerLinkActive="selected">
            <a routerLink="suppliers" class="nav-link"><i class="fa-solid fa-truck-field"></i>Suppliers</a>
          </li>
          <li routerLinkActive="selected">
            <a routerLink="delivery-worker" class="nav-link"><i class="fa-solid fa-people-group"></i>Delivery Workers</a>
          </li>
          <li routerLinkActive="selected">
            <a routerLink="medicines" class="nav-link"><i class="fa-solid fa-prescription-bottle-medical"></i>Medicines</a>
          </li>
          <li routerLinkActive="selected">
            <a routerLink="purchases" class="nav-link"><i class="fa-solid fa-cart-shopping"></i>Purchases</a>
          </li>
          <li routerLinkActive="selected">
            <a routerLink="deliveries" class="nav-link"><i class="fa-solid fa-truck"></i>Deliveries</a>
          </li>
          <li routerLinkActive="selected">
            <a routerLink="orders" class="nav-link"><i class="fa-solid fa-cart-flatbed-suitcase"></i>Orders</a>
          </li>
          <li>
              <a (click)="logout()" class="nav-link"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
          </li>
      </ul>
  </div>
  <div class="{{isPageContentOpen ? 'pageContent' : 'pageContent opened'}}" id="content">
      <router-outlet></router-outlet>
  </div>
</div>
