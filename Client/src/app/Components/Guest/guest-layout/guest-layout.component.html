<div class="signup-section">
  <div class="container">
      <form class="login fadeInDown" (ngSubmit)="login()" >
          <h2>Login Into Your Account</h2>
          <div class="errors" >
              <!-- <h3></h3> -->
          </div>
          <div class="field">
              <label for="">Email</label>
              <input type="email" name='email' required [(ngModel)]="formData.email" >
          </div>
          <div class="field">
              <label for="">Password</label>
              <input type="password" class='pass' name='password' required [(ngModel)]="formData.password">
          </div>
          <input type="submit" value='Login' id='submit-btn' name='login'>
      </form>
  </div>
</div>
