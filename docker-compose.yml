version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: PharmacyProject
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent", "-h", "localhost", "-u", "root", "-p1234"]     
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JwtConfig__Key: YourSuperSecretKeyThatIsAtLeast64CharactersLongWhichYouKeepSecure
      JwtConfig__Issuer: http://localhost:4200
      JwtConfig__Audience: http://localhost:4200
      JwtConfig__TokenValidityMins: "2"
      JwtConfig__RefreshTokenValidityMins: "4000"
      ConnectionStrings__DefaultConnection: server=mysql;user=root;password=1234;database=PharmacyProject;
    ports:
      - "5000:8080"

  client:
    build:
      context: .
      dockerfile: Client/Dockerfile
    container_name: client
    depends_on:
      - api
    ports:
      - "4200:4200"

volumes:
  mysql_data: